<!doctype html><html lang="de"><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#172a3b"><link rel="manifest" href="manifest.json"><title>Arbeitszeit</title><style>body{margin:0;background:#f3f6f9;font-family:system-ui;color:#17202a}.wrap{max-width:650px;margin:auto;padding:18px}.card{background:white;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 3px 14px #0001}h1{margin:0}.clock{text-align:center;font-size:52px;font-weight:800;margin:25px 0 5px}.status{text-align:center;font-weight:700;color:#149447}.actions{display:grid;gap:10px;margin-top:20px}button{padding:17px;border:0;border-radius:13px;font-size:18px;font-weight:700}.start{background:#149447;color:white}.pause{background:#df8600;color:white}.end{background:#c93636;color:white}.loc{margin-top:15px;padding:13px;background:#eaf5ff;border-radius:12px}.ok{color:#149447;font-weight:700}table{width:100%;border-collapse:collapse}td,th{padding:10px 3px;border-bottom:1px solid #eee;text-align:left}.muted{color:#667085}</style></head><body><div class="wrap"><div class="card"><h1>Arbeitszeit</h1><p class="muted">Mitarbeiter: Günther</p><div id="clock" class="clock">00:00:00</div><div id="status" class="status">Nicht eingestempelt</div><div class="actions"><button class="start" onclick="book('START')">▶ Arbeitszeit starten</button><button class="pause" onclick="book('PAUSE_START')">Ⅱ Pause starten</button><button class="end" onclick="book('ENDE')">■ Arbeitszeit beenden</button></div><div class="loc">📍 <b>Geofence</b><br><span class="muted">Standort wird nur beim Buchen geprüft.</span><br><span id="gps" class="ok">Noch keine Prüfung</span></div><p id="msg" class="muted"></p></div><div class="card"><h2>Heutige Buchungen</h2><table><tbody id="rows"></tbody></table></div></div><script>let start=localStorage.getItem('start');let pause=+localStorage.getItem('pause')||0;let ps=+localStorage.getItem('ps')||0;let punches=JSON.parse(localStorage.getItem('punches')||'[]');const fmt=d=>new Date(d).toLocaleTimeString('de-AT',{hour:'2-digit',minute:'2-digit'});function render(){rows.innerHTML=punches.map(x=>`<tr><td>${x.k}</td><td>${fmt(x.t)}</td></tr>`).join('')||'<tr><td>Noch keine Buchungen</td></tr>';status.textContent=start?'Arbeitszeit läuft':'Nicht eingestempelt'}function tick(){if(start){let ms=Date.now()-+start-pause;let s=Math.max(0,Math.floor(ms/1000));clock.textContent=[Math.floor(s/3600),Math.floor(s/60)%60,s%60].map(x=>String(x).padStart(2,'0')).join(':')}}async function book(k){if(!navigator.geolocation){msg.textContent='GPS wird von diesem Browser nicht unterstützt.';return}navigator.geolocation.getCurrentPosition(p=>{gps.textContent='✓ Standort ermittelt';punches.push({k,t:Date.now()});if(k==='START'){start=Date.now();localStorage.start=start}if(k==='ENDE'){start=null;localStorage.removeItem('start')}localStorage.punches=JSON.stringify(punches);msg.textContent='Buchung gespeichert.';render()},()=>msg.textContent='Standortzugriff bitte erlauben.',{enableHighAccuracy:true,timeout:10000})}render();setInterval(tick,1000);if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');</script></body></html>
